
[workspace]
members = ["crates/*", "examples/*/src-tauri", "examples/*/plugin"]
resolver = "2"
default-members = ["crates/core"]

[workspace.dependencies]
async-trait = "0.1"
bytes = "1.8"
darling = "0.20"
proc-macro2 = "1"
prost = "0.13"
prost-build = "0.13"
serde = "1.0"
syn = "2.0"
tauri = { version = "2", default-features = false }
thiserror = "1"
prost-types = "0.13"
heck = "0.5"
tower = "0.5"
base64 = "0.22"
tokio-stream = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tokio-util = "0.7"
serde_json = "1"
tauri-plugin = "2"
quote = "1"
schemars = "0.8"
kanamaru = { path = "./crates/core" }
kanamaru-build = { path = "./crates/build" }
anyhow = "1"
tauri-build = "2"

[workspace.package]
authors = ["tonymushah <tonymushahDev06@yahoo.com>"]

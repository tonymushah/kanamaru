
[workspace]
members = [
    "crates/*",
    "examples/*/src-tauri",
    "examples/*/plugin",
    "examples/*/crates/*",
]
resolver = "3"
default-members = ["crates/core"]

[workspace.dependencies]
async-trait = "0.1"
bytes = "1.8"
darling = "0.20"
proc-macro2 = "1"
prost = "0.14"
prost-build = "0.14"
serde = "1.0"
syn = "2.0"
tauri = { version = "2", default-features = false }
thiserror = "1"
prost-types = "0.14"
heck = "0.5"
tower = "0.5"
base64 = "0.22"
tokio-stream = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tokio-util = "0.7"
serde_json = "1"
tauri-plugin = "2"
quote = "1"
schemars = "0.8"
kanamaru = { path = "./crates/core" }
kanamaru-build = { path = "./crates/build", default-features = false }
anyhow = "1"
tauri-build = "2"
reqwest = "0.12.12"
# Lanitra manga example dependencies
atrium-api = "0.25"
bsky-sdk = "0.1"
lanitra-manga-proto-build = { path = "./examples/lanitra-manga/crates/proto-build" }
cid = "0"

[workspace.package]
authors = ["tonymushah <tonymushahDev06@yahoo.com>"]
license-file = "LICENSE"
readme = "./README.md"
repository = "https://github.com/tonymushah/kanamaru.git"
edition = "2024"
